# M2 generator config — Qwen2-VL 7B (4-bit), single-sentence query
m2: qwen2vl_simple
m2_kwargs:
  model_id: Qwen/Qwen2-VL-7B-Instruct
  load_in_4bit: true

k_queries: 3
generation:
  max_new_tokens: 60
  temperature: 1.0   # > 1.0 enables sampling when k>1

device: cuda
expected_vram_gb: 5
expected_seconds_per_image: 4
