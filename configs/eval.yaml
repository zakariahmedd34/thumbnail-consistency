# Evaluation config (paths are absolute, Drive-rooted)

# Three eval sets, in increasing difficulty
consistency_eval_jsonl:       /content/drive/MyDrive/thumbnail_project/processed/consistency_eval.jsonl
consistency_eval_hard_jsonl:  /content/drive/MyDrive/thumbnail_project/processed/consistency_eval_hard.jsonl
consistency_eval_qmiss_jsonl: /content/drive/MyDrive/thumbnail_project/processed/consistency_eval_query_mismatch.jsonl

# Cached embeddings
m2_image_emb_npz:   /content/drive/MyDrive/thumbnail_project/processed/m2_image_emb.npz
thumbnail_emb_npz:  /content/drive/MyDrive/thumbnail_project/processed/thumbnail_image_emb.npz

# Manual gold labels (50 pairs, optional Day-3 task)
manual_gold_jsonl:  /content/drive/MyDrive/thumbnail_project/processed/manual_gold.jsonl

# Generated M2 queries (from train_clipcap)
m2_generated_jsonl: /content/drive/MyDrive/thumbnail_project/outputs/predictions/m2_generated.jsonl

ablation_query_sources:
  - gt_query        # ground-truth QVH query (ceiling)
  - clipcap_k3      # 3 nucleus-sampled queries from ClipCap
  - clipcap_k1      # single beam-3 query from ClipCap
  - thumb_only      # alpha=0 (no query path)
  - random_query    # control

alpha_sweep: [0.0, 0.25, 0.5, 0.75, 1.0]   # for the query-mismatch ablation

output:
  predictions_jsonl: /content/drive/MyDrive/thumbnail_project/outputs/predictions/consistency_scores.jsonl
  figures_dir:       /content/drive/MyDrive/thumbnail_project/outputs/figures
