# Drive-relative paths — single source of truth for Colab+Drive runs.
# Every other config file references these (or you override DATA_ROOT via env var).

# Top-level root containing all data
data_root: /content/drive/MyDrive/thumbnail_project

# Subdirs under data_root
videos_dir:       /content/drive/MyDrive/thumbnail_project/qvh_videos
frames_dir:       /content/drive/MyDrive/thumbnail_project/qvh_frames
multi_frames_dir: /content/drive/MyDrive/thumbnail_project/qvh_frames_multi
within_neg_dir:   /content/drive/MyDrive/thumbnail_project/qvh_frames_within_neg
thumbnails_dir:   /content/drive/MyDrive/thumbnail_project/qvh_thumbnails
processed_dir:    /content/drive/MyDrive/thumbnail_project/processed
outputs_dir:      /content/drive/MyDrive/thumbnail_project/outputs

# Moment-DETR
moment_detr_features_archive: /content/drive/MyDrive/thumbnail_project/moment_detr_features.tar.gz
moment_detr_repo_root:        /content/drive/MyDrive/thumbnail_project/moment_detr
m1_ckpt:                      /content/drive/MyDrive/thumbnail_project/moment_detr/run_on_video/moment_detr_ckpt/model_best.ckpt

# Where to extract features to (LOCAL Colab SSD, not Drive, to avoid small-file rate-limit)
feature_extract_target: /content/features_local

# Checkpoints (M2 trained model lives here)
checkpoints_dir: /content/drive/MyDrive/thumbnail_project/checkpoints
